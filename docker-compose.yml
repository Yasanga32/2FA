version: '3.8'

services:
  mongo:
    image: mongo
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./server
    ports:
      - "5000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/dev_db
    depends_on:
      - mongo

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:5173"
    depends_on:
      - backend

volumes:
  mongo-data: